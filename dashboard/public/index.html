<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Cokacremote Monitor</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <h1>Cokacremote Monitor</h1>
      <p id="updated">연결 대기 중</p>
    </div>
    <div class="headerActions">
      <button id="refresh" class="ghost">새로고침</button>
      <button id="settings" class="ghost hidden">설정</button>
    </div>
  </header>

  <main>
    <section id="authCard" class="panel">
      <h2>대시보드 연결</h2>
      <p>배포 시 설정한 Dashboard Token을 입력합니다. 토큰은 이 기기의 브라우저에만 저장됩니다.</p>
      <form id="authForm">
        <input id="token" type="password" autocomplete="current-password" placeholder="Dashboard Token" required>
        <button type="submit">연결</button>
      </form>
    </section>

    <section>
      <div class="sectionTitle">
        <h2>인스턴스</h2>
        <span id="instanceCount"></span>
      </div>
      <div id="instances" class="grid"></div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <div class="dialogHead">
      <div>
        <h2>설정</h2>
        <p>이 기기의 대시보드와 알림 설정입니다.</p>
      </div>
      <button id="closeSettings" class="iconButton ghost" aria-label="설정 닫기">×</button>
    </div>

    <section class="settingsSection">
      <h3>알림</h3>
      <p id="pushState">알림 상태 확인 중</p>
      <div class="actions">
        <button id="enablePush">알림 켜기</button>
        <button id="testPush" class="ghost">테스트</button>
      </div>
    </section>

    <section class="settingsSection settingsDanger">
      <h3>연결</h3>
      <p>저장된 Dashboard Token을 이 브라우저에서 제거합니다.</p>
      <button id="logout" class="danger ghost">로그아웃</button>
    </section>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
